plugins {
    id 'java-library'
    id 'fabric-loom' version '1.17.19'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                rootProject.java_version as int
        )
    }
}

repositories {
    mavenCentral()

    maven {
        url = 'https://maven.fabricmc.net/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

    mappings loom.officialMojangMappings()
}

tasks.register('checkFurnituresGeometry', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.scp_genesis.common.furnitures.client.FurnituresGeometryTest'
}

tasks.named('check') {
    dependsOn tasks.named('checkFurnituresGeometry')
    dependsOn tasks.named('checkLockers')
}

tasks.register('checkLockers', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.scp_genesis.common.furnitures.LockerTest'
}

// These checks are standalone Minecraft bootstrap programs, not JUnit tests.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

tasks.withType(JavaExec).configureEach {
    if (name in ['checkFurnituresGeometry', 'checkLockers']) {
        workingDir = layout.buildDirectory.dir("checks/${name}").get().asFile
        doFirst { workingDir.mkdirs() }
    }
}
