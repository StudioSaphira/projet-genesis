plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(
                rootProject.java_version as int
        )
    }
}

neoForge {
    version = rootProject.neoforge_version

    runs {
        client {
            client()
        }

        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        scp_genesis {
            sourceSet sourceSets.main
            sourceSet project(':common').sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
}

tasks.register('checkSlopeLighting', JavaExec) {
    dependsOn testClasses
    classpath = project(':common').sourceSets.main.output + sourceSets.test.runtimeClasspath
    mainClass = 'net.scp_genesis.neoforge.copycatblocks.renderer.geometry.SlopeLightingTest'
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

tasks.named('test') { failOnNoDiscoveredTests = false }
tasks.named('check') { dependsOn tasks.named('checkSlopeLighting') }
