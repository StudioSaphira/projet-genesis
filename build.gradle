plugins {
    id 'base'
}

group = 'net.scp_genesis'
version = project.mod_version

subprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

tasks.register('buildAll') {
    dependsOn(
            ':fabric:build',
            ':neoforge:build'
    )
}